[build-system]
requires = ["uv_build>=0.10.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "mosaic-media"
version = "0.3.3"
description = "Media probing, transcode planning, and frame reading through system ffmpeg."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ecodylic Science" }]
# No `License ::` trove classifier. `license` above is a PEP 639 SPDX
# expression, and the two cannot coexist -- a build carrying both is rejected
# rather than warned about.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/EcodylicScience/mosaic-media"
Source = "https://github.com/EcodylicScience/mosaic-media"
Issues = "https://github.com/EcodylicScience/mosaic-media/issues"

[project.optional-dependencies]
io = ["numpy>=1.22", "av>=18,<19"]
cli = ["typer>=0.12"]

[project.scripts]
mosaic-media = "mosaic_media.cli:main"

[dependency-groups]
dev = ["basedpyright>=1.38.2", "ruff>=0.15.4", "pytest>=8.0", "pytest-xdist>=3.8.0"]
bench = ["opencv-python>=4.7", "numpy>=1.22"]

[tool.pytest.ini_options]
addopts = "-m 'not bench'"
markers = [
    "bench: performance regression gate against OpenCV; excluded by default, run explicitly and serialized with pytest -m bench -n0 -s on an otherwise idle machine",
]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "all"
include = ["src", "tests", "scripts"]
# numpy (the [io] extra), av (the [io] extra), and opencv-python (the bench
# group) leak Any/Unknown through their public surfaces; that is not our
# code's problem.
reportAny = false
reportMissingTypeStubs = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
# Ban explicit Any in our own annotations.
reportExplicitAny = "error"
